name: Gold Price Monitor Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch gold price
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://xaus.com/api/v1/spot"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "GoldAlertApp/1.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          price = data.get("spot_usd_oz")

          if price is None:
              raise ValueError("Gold price field not found: " + str(data))

          print("XAU spot price in USD per ounce:", price)
          print("Data retrieved successfully.")
          PY
